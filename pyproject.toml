[tool.poetry]
name = "esp32-configurator"
version = "3.0.0"
description = "ESP32 devices and sensors configurator"
authors = ["Stefano Cappa"]
readme = "README.md"
include = [
    {path = "templates", format = ["sdist", "wheel"]}
]
packages = [
    {include = "src"}
]

[tool.poetry.scripts]
esp32-configurator = "src.__main__:main"

[tool.poetry.dependencies]
python = "^3.12"
jinja2 = "^3.1.6"
pydantic = "^2.14.1"
pyyaml = "^6.0.3"

[tool.poetry.group.dev.dependencies]
pyrefly = "^1.4.0"
pip-audit = "^2.10.1"
types-pyyaml = "^6.0.12.20260906"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
check-unannotated-defs = true
infer-return-types = "checked"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
